name: Snapshot

# Publishes the pending changesets as <version>-next-<timestamp> under the `next` dist-tag,
# for host apps to test unreleased work. Nothing is committed back.
on:
  workflow_dispatch:

concurrency:
  group: snapshot
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC) and provenance

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm snapshot
        env:
          NPM_CONFIG_PROVENANCE: 'true'
